# Local development stack: Postgres, Redis, the API, a Celery worker and the
# built frontend behind nginx.
#
#   cp .env.example .env      # fill in OPENROUTER_API_KEY if you want AI parsing
#   docker compose up --build
#   open http://localhost:3000
#
# The API runs migrations on start, so there is no separate setup step. To run
# a one-shot command against the same image:
#
#   docker compose run --rm api alembic history
#
# There is no `version:` key — it has been ignored since Compose v2 and only
# produces a warning.

name: gstbot

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  # Defaulted so `docker compose up` works from a bare checkout with no .env.
  # Every one of these is a development-only value; the production deployment
  # supplies its own and `validate_startup_config` complains if it does not.
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-any-real-deployment}
  DATABASE_URL: postgresql+psycopg://gstbot:gstbot@postgres:5432/gstbot
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CELERY_ENABLED: ${CELERY_ENABLED:-true}
  # The frontend is same-origin through nginx, so this is only for a browser
  # pointed straight at the API or a Vite dev server run on the host.
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  UPLOAD_DIR: /app/data/invoices
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
  OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-qwen/qwen2.5-vl-72b-instruct:free}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gstbot
      POSTGRES_PASSWORD: gstbot
      POSTGRES_DB: gstbot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed so psql and a locally-run test suite can reach it. 5433 on the
      # host to avoid colliding with a Postgres already installed there.
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # -U matters: without it pg_isready checks the OS user, which passes
      # before the database this app uses actually exists.
      test: ["CMD-SHELL", "pg_isready -U gstbot -d gstbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Rate-limit counters and Celery results are both reconstructible, so
    # persistence buys nothing and costs a fsync on every write.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *api-env
    volumes:
      # Named volume rather than a bind mount: uploaded invoices should survive
      # `docker compose down` but not clutter the working tree.
      - invoice-data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["worker"]
    environment: *api-env
    volumes:
      # The same volume as the API, and it has to be: the worker parses the
      # file the API wrote, and only the row is passed through the broker.
      - invoice-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not service_healthy — the worker does not serve traffic, and waiting
      # for the API's healthcheck would just delay it behind the migration.
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      # nginx resolves `api` at startup and refuses to start if it does not
      # exist yet, so this dependency is load-bearing rather than cosmetic.
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  invoice-data:
