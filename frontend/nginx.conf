# Serves the built SPA and proxies /api to the backend, so the browser talks to
# one origin and CORS never enters the picture in a container deployment —
# matching what the Vite dev server does locally.

upstream gstbot_api {
    # The compose service name. Resolved at startup; if the API is not up yet
    # nginx would refuse to start, hence `depends_on` in the compose file.
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An invoice PDF or a purchase register can be several MB, and the limit
    # that matters is the app's MAX_UPLOAD_MB — nginx should not be the thing
    # that rejects the file, with a bare 413 the UI cannot explain.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames: safe to cache forever, and they must be, or a returning
    # user re-downloads the whole bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://gstbot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Passed through rather than generated: the browser may already carry
        # an id from a previous hop, and the API only mints one when absent.
        proxy_set_header X-Request-ID $http_x_request_id;

        # An invoice parse that falls back to inline processing waits on a
        # model call. The default 60s read timeout cuts that off mid-parse.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Exports stream; buffering them costs memory and time to first byte.
        proxy_buffering off;
    }

    # index.html must never be cached: it is the only file whose name does not
    # change between deploys, so a cached copy pins the user to a dead bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: /invoices/42 is a React route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
